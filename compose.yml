name: openclaw-mission-control
services:
  db:
    image: 'postgres:16-alpine'
    environment:
      POSTGRES_DB: '${POSTGRES_DB:-mission_control}'
      POSTGRES_USER: '${POSTGRES_USER:-postgres}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-postgres}'
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB'
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: 'redis:7-alpine'
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 5
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: 'postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-mission_control}'
      CORS_ORIGINS: '${CORS_ORIGINS:-https://agents.hekatool.de}'
      DB_AUTO_MIGRATE: '${DB_AUTO_MIGRATE:-true}'
      AUTH_MODE: '${AUTH_MODE}'
      LOCAL_AUTH_TOKEN: '${LOCAL_AUTH_TOKEN}'
      BASE_URL: '${BASE_URL:-https://agents.hekatool.de}'
      RQ_REDIS_URL: 'redis://redis:6379/0'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.backend.rule=Host(`agents.hekatool.de`) && PathPrefix(`/api`)'
      - 'traefik.http.routers.backend.entrypoints=https'
      - 'traefik.http.routers.backend.tls=true'
      - 'traefik.http.services.backend.loadbalancer.server.port=8000'
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: '${NEXT_PUBLIC_API_URL:-auto}'
        NEXT_PUBLIC_AUTH_MODE: '${AUTH_MODE}'
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      NEXT_PUBLIC_API_URL: '${NEXT_PUBLIC_API_URL:-auto}'
      NEXT_PUBLIC_AUTH_MODE: '${AUTH_MODE}'
    depends_on:
      - backend
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.frontend.rule=Host(`agents.hekatool.de`)'
      - 'traefik.http.routers.frontend.entrypoints=https'
      - 'traefik.http.routers.frontend.tls=true'
      - 'traefik.http.services.frontend.loadbalancer.server.port=3000'
  webhook-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - python
      - scripts/rq-docker
      - worker
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: 'postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-mission_control}'
      AUTH_MODE: '${AUTH_MODE}'
      LOCAL_AUTH_TOKEN: '${LOCAL_AUTH_TOKEN}'
      BASE_URL: '${BASE_URL:-https://agents.hekatool.de}'
      RQ_REDIS_URL: 'redis://redis:6379/0'
      RQ_QUEUE_NAME: '${RQ_QUEUE_NAME:-default}'
      RQ_DISPATCH_THROTTLE_SECONDS: '${RQ_DISPATCH_THROTTLE_SECONDS:-2.0}'
      RQ_DISPATCH_MAX_RETRIES: '${RQ_DISPATCH_MAX_RETRIES:-3}'
    restart: unless-stopped
volumes:
  postgres_data: null
